<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const alvos = [
  { nome: 'icon-512', tamanho: 512 },
  { nome: 'icon-192', tamanho: 192 },
  { nome: 'icon-180', tamanho: 180 },
  { nome: 'icon-64', tamanho: 64 },
  { nome: 'icon-maskable-512', tamanho: 512, folga: 0.78 },
];
const img = new Image();
img.onload = () => {
  for (const alvo of alvos) {
    const c = document.createElement('canvas');
    c.width = c.height = alvo.tamanho;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (alvo.folga) {
      const g = ctx.createLinearGradient(0, 0, 0, alvo.tamanho);
      g.addColorStop(0, '#a5dafd');
      g.addColorStop(1, '#fec7e1');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, alvo.tamanho, alvo.tamanho);
      const lado = alvo.tamanho * alvo.folga;
      const margem = (alvo.tamanho - lado) / 2;
      ctx.drawImage(img, margem, margem, lado, lado);
    } else {
      ctx.drawImage(img, 0, 0, alvo.tamanho, alvo.tamanho);
    }
    const div = document.createElement('div');
    div.className = 'icone';
    div.dataset.nome = alvo.nome;
    div.textContent = c.toDataURL('image/png');
    document.body.appendChild(div);
  }
};
img.src = './assets/logo.png';
</script></body></html>
