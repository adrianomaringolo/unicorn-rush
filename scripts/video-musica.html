<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Trilha do anúncio</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 18px;
         background: linear-gradient(#bfe9ff, #ffe3f4); font-family: system-ui, sans-serif; color: #6b3fa0; }
  button { font: inherit; font-size: 20px; padding: 14px 28px; border: 0; border-radius: 999px;
           background: #ff5fa2; color: #fff; cursor: pointer; }
  p { max-width: 32em; text-align: center; line-height: 1.5; }
</style>
<script type="importmap">
  { "imports": { "three": "../vendor/three.module.js", "three/": "../vendor/" } }
</script>
</head><body>

<h1>🎵 Trilha do anúncio</h1>
<p>O medley que toca no vídeo de ~55 s, montado com os temas de verdade do
   jogo — os mesmos <code>THEMES</code> que o <code>src/game/music.js</code>
   toca nas pistas. <code>npm run video</code> renderiza isto num WAV.</p>
<button id="tocar">▶︎ Ouvir</button>

<script type="module">
// A trilha do vídeo de anúncio.
//
// O jogo não tem arquivo de música: cada pista é um punhado de notas MIDI
// que osciladores do WebAudio tocam em laço (ver src/game/music.js). Para o
// vídeo isso é sorte — dá para montar a trilha com os temas de verdade, sem
// licença de ninguém e sem um mega de MP3 no repositório.
//
// O que muda em relação ao jogo são duas coisas, e as duas porque ali a
// música toca **debaixo** de uma criança jogando e aqui ela é a única coisa
// que se ouve:
//
//   1. tem bateria, e ela entra por camadas — o anúncio precisa crescer;
//   2. é um medley com hora marcada, cortado para os cortes do vídeo
//      caírem no tempo da música (ver o ROTEIRO em scripts/video.js).
//
// Renderiza num OfflineAudioContext: sai um WAV pronto, mais rápido que o
// tempo real e igualzinho toda vez.
import { THEMES } from '../src/game/music.js';

const TAXA = 48000;

const noteHz = (midi) => 440 * 2 ** ((midi - 69) / 12);
const colcheia = (bpm) => 30 / bpm;
const compasso = (bpm) => colcheia(bpm) * 32;   // o laço inteiro de um tema

// As três seções do medley. Cada uma é um tema do jogo tocado um número
// inteiro de laços — é isso que faz a emenda cair na barra de compasso em
// vez de no meio de uma frase.
//
// Campo abre e Campo fecha: é o tema que a criança ouve no primeiro minuto
// de jogo, e voltar a ele no fim é o que faz o anúncio soar como uma coisa
// só. Frutas no meio porque é mais rápido (132 contra 124) e mais agudo —
// a subida acontece sozinha, sem precisar acelerar nada.
//
// Frutas leva três laços em vez de dois: é o trecho mais longo do vídeo,
// com a rajada de seis pistas, os power-ups em ação e a grade dos unicórnios
// (ver o ROTEIRO em scripts/video.js).
const SECOES = [
  { tema: 'campo', laços: 2, bateria: 'entrando' },
  { tema: 'frutas', laços: 3, bateria: 'cheia' },
  { tema: 'campo', laços: 2, bateria: 'cheia' },
];

// O acorde do fim, depois da última seção: dó maior aberto, deixado soar
// enquanto o letreiro fica na tela.
//
// São 2,5 s e não um piscar porque é o acorde que segura o último quadro —
// o do endereço do jogo, o único que alguém pode querer parar para ler.
const FINAL = 2.5;

const DURACAO = SECOES.reduce(
  (t, s) => t + compasso(THEMES[s.tema].bpm) * s.laços, 0,
) + FINAL;

// --- Vozes ----------------------------------------------------------------

// Mesmo envelope do jogo (ver `voice`, em src/game/music.js): sobe em 20 ms
// e desce em rampa exponencial até o fim da nota. Copiado e não importado
// porque lá ele fala com o `master` do jogo, que aqui não existe.
function voz(ctx, destino, freq, inicio, dur, onda, nivel, pan = 0) {
  const osc = ctx.createOscillator();
  const ganho = ctx.createGain();
  osc.type = onda;
  osc.frequency.setValueAtTime(freq, inicio);
  ganho.gain.setValueAtTime(0.0001, inicio);
  ganho.gain.exponentialRampToValueAtTime(nivel, inicio + 0.02);
  ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + dur);
  const panner = ctx.createStereoPanner();
  panner.pan.value = pan;
  osc.connect(ganho).connect(panner).connect(destino);
  osc.start(inicio);
  osc.stop(inicio + dur + 0.05);
}

// Um segundo de ruído, reaproveitado por chimbal e palma.
function ruido(ctx) {
  const buf = ctx.createBuffer(1, TAXA, TAXA);
  const dados = buf.getChannelData(0);
  for (let i = 0; i < dados.length; i++) dados[i] = Math.random() * 2 - 1;
  return buf;
}

function bumbo(ctx, destino, t) {
  const osc = ctx.createOscillator();
  const ganho = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(145, t);
  osc.frequency.exponentialRampToValueAtTime(46, t + 0.09);
  ganho.gain.setValueAtTime(0.0001, t);
  ganho.gain.exponentialRampToValueAtTime(0.9, t + 0.006);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  osc.connect(ganho).connect(destino);
  osc.start(t);
  osc.stop(t + 0.26);
}

function chimbal(ctx, destino, buf, t, nivel) {
  const fonte = ctx.createBufferSource();
  fonte.buffer = buf;
  const passa = ctx.createBiquadFilter();
  passa.type = 'highpass';
  passa.frequency.value = 7800;
  const ganho = ctx.createGain();
  ganho.gain.setValueAtTime(nivel, t);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  fonte.connect(passa).connect(ganho).connect(destino);
  fonte.start(t, 0, 0.06);
}

function palma(ctx, destino, buf, t) {
  const fonte = ctx.createBufferSource();
  fonte.buffer = buf;
  const faixa = ctx.createBiquadFilter();
  faixa.type = 'bandpass';
  faixa.frequency.value = 1750;
  faixa.Q.value = 1.1;
  const ganho = ctx.createGain();
  ganho.gain.setValueAtTime(0.0001, t);
  ganho.gain.exponentialRampToValueAtTime(0.45, t + 0.004);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  fonte.connect(faixa).connect(ganho).connect(destino);
  fonte.start(t, 0, 0.18);
}

// O prato do fim: ruído longo abrindo junto com o acorde.
function prato(ctx, destino, buf, t) {
  const fonte = ctx.createBufferSource();
  fonte.buffer = buf;
  const passa = ctx.createBiquadFilter();
  passa.type = 'highpass';
  passa.frequency.value = 5200;
  const ganho = ctx.createGain();
  ganho.gain.setValueAtTime(0.0001, t);
  ganho.gain.exponentialRampToValueAtTime(0.32, t + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  fonte.connect(passa).connect(ganho).connect(destino);
  fonte.start(t, 0, 1.3);
}

// --- A montagem -----------------------------------------------------------

async function renderizar() {
  const ctx = new OfflineAudioContext(2, Math.ceil(DURACAO * TAXA), TAXA);

  // Um compressor no fim de tudo, só de guarda: com bateria e duas vozes
  // por nota, os picos se somam e estouram sem ele.
  const limite = ctx.createDynamicsCompressor();
  limite.threshold.value = -8;
  limite.ratio.value = 8;
  limite.attack.value = 0.003;
  limite.release.value = 0.2;
  limite.connect(ctx.destination);

  const barulho = ruido(ctx);
  let t = 0;

  for (const secao of SECOES) {
    const tema = THEMES[secao.tema];
    const oitavo = colcheia(tema.bpm);
    const semínima = oitavo * 2;
    const passos = 32 * secao.laços;
    const inicioSecao = t;

    // O tema entra num ganho próprio para as seções poderem se cruzar sem
    // um degrau no volume. `gain` do tema é o volume dele **dentro do
    // jogo**, debaixo dos efeitos; aqui a música é sozinha e sobe.
    const bus = ctx.createGain();
    bus.gain.value = tema.gain * 5.2;
    bus.connect(limite);

    const busBateria = ctx.createGain();
    busBateria.gain.value = 0.42;
    busBateria.connect(limite);

    for (let passo = 0; passo < passos; passo++) {
      const quando = inicioSecao + passo * oitavo;
      const nota = tema.melody[passo % tema.melody.length];

      if (nota !== null && nota !== undefined) {
        voz(ctx, bus, noteHz(nota), quando, oitavo * 1.7, tema.wave, 0.5, 0.12);
        // A oitava acima baixinha, como no jogo: é ela que dá o brilho.
        voz(ctx, bus, noteHz(nota + 12), quando, oitavo * 1.1, 'sine', 0.12, -0.18);
      }

      if (passo % 2 === 0) {
        const grave = tema.bass[(passo / 2) % tema.bass.length];
        if (grave !== null && grave !== undefined) {
          voz(ctx, bus, noteHz(grave), quando, oitavo * 2.6, tema.bassWave, 0.55);
        }
      }

      // A bateria entra por camadas na primeira seção — o anúncio começa
      // como o jogo começa, só a melodia, e vai enchendo. Da segunda em
      // diante já entra inteira.
      const compassoAtual = Math.floor(passo / 8);
      const cheia = secao.bateria === 'cheia';
      const temChimbal = cheia || compassoAtual >= 1;
      const temBumbo = cheia || compassoAtual >= 2;
      const temPalma = cheia || compassoAtual >= 3;

      if (temChimbal) chimbal(ctx, busBateria, barulho, quando, passo % 2 ? 0.16 : 0.1);
      if (temBumbo && passo % 2 === 0) bumbo(ctx, busBateria, quando);
      // Palma no 2 e no 4 de cada compasso de quatro tempos.
      if (temPalma && passo % 8 === 4) palma(ctx, busBateria, barulho, quando);
      // E uma virada de bumbo antes de virar a seção, para a emenda ter
      // para onde ir.
      if (temBumbo && passo === passos - 1) bumbo(ctx, busBateria, quando + semínima / 2);
    }

    t = inicioSecao + passos * oitavo;
  }

  // --- O acorde do fim ----------------------------------------------------
  const fim = ctx.createGain();
  fim.gain.value = 0.5;
  fim.connect(limite);
  // Dó maior com a nona: o mesmo dó em que o tema do Campo vive, aberto
  // para soar grande em vez de resolvido e seco.
  for (const [nota, pan] of [[48, 0], [60, -0.2], [64, 0.2], [67, -0.1], [72, 0.15], [74, 0]]) {
    voz(ctx, fim, noteHz(nota), t, FINAL * 0.95, 'triangle', nota > 66 ? 0.28 : 0.42, pan);
  }
  prato(ctx, fim, barulho, t);
  bumbo(ctx, fim, t);

  return ctx.startRendering();
}

// --- WAV ------------------------------------------------------------------

// PCM 16 bits, que é o que o ffmpeg quer sem discutir.
function paraWav(buffer) {
  const canais = buffer.numberOfChannels;
  const quadros = buffer.length;
  const bytes = quadros * canais * 2;
  const saida = new DataView(new ArrayBuffer(44 + bytes));

  const texto = (pos, s) => { for (let i = 0; i < s.length; i++) saida.setUint8(pos + i, s.charCodeAt(i)); };
  texto(0, 'RIFF');
  saida.setUint32(4, 36 + bytes, true);
  texto(8, 'WAVEfmt ');
  saida.setUint32(16, 16, true);
  saida.setUint16(20, 1, true);              // PCM
  saida.setUint16(22, canais, true);
  saida.setUint32(24, buffer.sampleRate, true);
  saida.setUint32(28, buffer.sampleRate * canais * 2, true);
  saida.setUint16(32, canais * 2, true);
  saida.setUint16(34, 16, true);
  texto(36, 'data');
  saida.setUint32(40, bytes, true);

  const trilhas = Array.from({ length: canais }, (_, c) => buffer.getChannelData(c));
  let pos = 44;
  for (let i = 0; i < quadros; i++) {
    for (let c = 0; c < canais; c++) {
      const v = Math.max(-1, Math.min(1, trilhas[c][i]));
      saida.setInt16(pos, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      pos += 2;
    }
  }
  return new Uint8Array(saida.buffer);
}

function base64(bytes) {
  let s = '';
  const pedaço = 0x8000;   // `apply` não aguenta o array inteiro de uma vez
  for (let i = 0; i < bytes.length; i += pedaço) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + pedaço));
  }
  return btoa(s);
}

// É por aqui que o scripts/video.js pega a trilha: renderiza, vira WAV e
// fica guardado em pedaços — o base64 inteiro passa de sete megas, e mandar
// isso numa mensagem só do DevTools trava.
window.renderizarTrilha = async () => {
  const wav = paraWav(await renderizar());
  window.__wav = base64(wav);
  return { bytes: wav.length, base64: window.__wav.length, duracao: DURACAO };
};
window.pedacoDaTrilha = (i, tamanho) => window.__wav.slice(i * tamanho, (i + 1) * tamanho);

// Com janela, o botão toca a trilha para dar para conferir antes de gerar.
document.getElementById('tocar').addEventListener('click', async () => {
  const botao = document.getElementById('tocar');
  botao.textContent = '⏳ renderizando…';
  const buffer = await renderizar();
  const ctx = new AudioContext();
  const fonte = ctx.createBufferSource();
  fonte.buffer = buffer;
  fonte.connect(ctx.destination);
  fonte.start();
  botao.textContent = `▶︎ ouvir de novo (${DURACAO.toFixed(1)} s)`;
});
</script>
</body></html>
