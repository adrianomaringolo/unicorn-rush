<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5d8f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UnicornRush 🦄</title>
  <link rel="icon" href="./assets/icons/icon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="UnicornRush" />
  <link rel="preload" href="./assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/": "./vendor/" } }
  </script>
</head>
<body>
  <!-- Tela de carregamento: o jogo baixa 1,9 MB de three.js e depois monta o
       mundo 3D — tempo suficiente, num celular, para uma criança achar que
       travou.

       A espera é uma barra de progresso, mas quem a enche é a Uni: ela corre
       da esquerda para a direita e vai deixando o arco-íris para trás. É o
       modelo 3D do jogo, gravado quadro a quadro (`npm run gravar-uni`, ver
       scripts/gravar-uni.html) — rodar three.js aqui seria esperar 1,9 MB de
       JavaScript justamente para cobrir a espera de 1,9 MB de JavaScript.

       Tudo o que está aqui é HTML e CSS, para pintar no primeiro quadro e
       continuar andando mesmo nos instantes em que o jogo trava a thread
       principal para montar o mundo. -->
  <div id="loading" role="status" aria-label="Carregando o jogo">
    <p class="load-brand">UnicornRush</p>
    <div class="load-pista">
      <i class="load-feito"></i>
      <img class="load-uni" src="./assets/loading/uni.webp" alt="" width="300" height="260"
           decoding="async" fetchpriority="high" draggable="false" />
    </div>
    <p class="load-text">Preparando a pista<span class="load-reticencias">…</span></p>
  </div>

  <div id="stage">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="panel score">
        <span class="label">Pontos</span>
        <span id="score">0</span>
      </div>
      <div class="panel hearts">
        <span class="label">Corações</span>
        <span><img class="fi" src="./assets/emoji/growing_heart.png" alt="💗" draggable="false" /> <span id="hearts">0</span></span>
      </div>
      <div class="panel goal">
        <span class="label">Meta</span>
        <span id="goal">0/25</span>
      </div>
      <div class="panel level">
        <span class="label">Fase</span>
        <span id="level">1</span>
      </div>
      <div class="panel keys">
        <span class="label">Chaves</span>
        <span><img class="fi" src="./assets/emoji/key.png" alt="🔑" draggable="false" /> <span id="keys">0/3</span></span>
      </div>
      <div class="panel lives">
        <span class="label">Vidas</span>
        <span id="lives"><img class="fi" src="./assets/emoji/growing_heart.png" alt="💗" draggable="false" /><img class="fi" src="./assets/emoji/growing_heart.png" alt="💗" draggable="false" /><img class="fi" src="./assets/emoji/growing_heart.png" alt="💗" draggable="false" /></span>
      </div>
      <div class="panel distance">
        <span class="label">Distância</span>
        <span id="distance">0</span>
      </div>
      <div class="panel best">
        <span class="label">Recorde</span>
        <span id="best">0</span>
      </div>
      <div id="hud-buttons">
        <button id="pause" class="panel mute" aria-label="Pausar o jogo" hidden><img class="fi" src="./assets/emoji/pause_button.png" alt="⏸️" draggable="false" /></button>
        <button id="mute" class="panel mute" aria-label="Ligar ou desligar a música"><img class="fi" src="./assets/emoji/speaker_high_volume.png" alt="🔊" draggable="false" /></button>
        <button id="rush" class="panel mute" aria-label="Correr mais rápido" aria-pressed="false" hidden><img class="fi" src="./assets/emoji/high_voltage.png" alt="⚡" draggable="false" /><span class="rush-label">RÁPIDO</span></button>
        <div id="speed" class="panel gauge" hidden>
          <span class="label">Velocidade</span>
          <span id="speed-value">0</span>
          <span class="gauge-bar"><i></i></span>
        </div>
      </div>
    </div>

    <!-- O portal que se abre ao destrancar um unicórnio ou uma pista. Vive
         fora do #overlay porque é um momento, não uma tela: ocupa tudo,
         acontece e sai (ver Game.revealUnlock). -->
    <div id="reveal" hidden></div>

    <div id="flash"></div>
    <div id="powers"></div>
    <!-- A frase da aula, no modo Aprender. Fica fixa enquanto a aula dura,
         ao contrário do #toast, que passa (ver Game.updateLesson). -->
    <!-- A frase da aula e, embaixo dela, uma bolinha por aula da lição. Vão
         juntos numa caixa só para as bolinhas acompanharem a faixa quando
         ela cresce para duas linhas. -->
    <div id="lesson-box" hidden>
      <p id="lesson" hidden></p>
      <div id="lesson-dots" hidden></div>
    </div>

    <!-- A seta do movimento que a aula está pedindo. As três casas têm a
         mesma largura e o mesmo espaçamento dos botões de toque, para cada
         seta cair exatamente em cima do botão de que fala. -->
    <div id="lesson-hint" hidden>
      <span data-seta="left"></span><span data-seta="jump"></span><span data-seta="right"></span>
    </div>
    <div id="lesson-ok" hidden><img class="fi" src="./assets/emoji/check_mark_button.png" alt="✅" /></div>
    <div id="toast"></div>

    <div id="touch-controls">
      <button data-action="left" aria-label="Ir para a esquerda"><img class="fi" src="./assets/emoji/left_arrow.png" alt="⬅️" draggable="false" /></button>
      <button data-action="jump" aria-label="Pular"><img class="fi" src="./assets/emoji/up_arrow.png" alt="⬆️" draggable="false" /></button>
      <button data-action="right" aria-label="Ir para a direita"><img class="fi" src="./assets/emoji/right_arrow.png" alt="➡️" draggable="false" /></button>
    </div>

    <div id="overlay">
      <div class="card">
        <button id="overlay-back" class="corner-button back" aria-label="Voltar" hidden><img class="fi" src="./assets/emoji/left_arrow.png" alt="⬅️" draggable="false" /></button>
        <button id="overlay-grown" class="corner-button grown" aria-label="Cantinho dos adultos (segure o dedo)" hidden><img class="fi" src="./assets/emoji/crown.png" alt="👑" draggable="false" /></button>
        <p class="brand">
          <img class="brand-mark" src="./assets/icons/icon-64.png" alt="" width="26" height="26" />UnicornRush
          <span id="wallet" class="wallet" title="chaves mágicas guardadas" hidden></span>
          <span id="test-badge" class="test-badge" title="modo teste ligado: nada está sendo guardado" hidden><img class="fi" src="./assets/emoji/test_tube.png" alt="🧪" draggable="false" /> teste</span>
        </p>
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <div id="overlay-extra"></div>
        <div id="overlay-buttons"></div>
        <p class="hint">
          <span class="hint-keyboard">
            <span class="hint-arrows"><b>Setas</b> para escolher · </span>
            <b>Enter</b> para o botão grande
          </span>
          <span class="hint-touch">
            Toque na figura que você quiser
          </span>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script>
    // Rede de segurança: se o jogo não carregar (rede caída no meio de um
    // arquivo, módulo com erro), a tela de carregamento sai sozinha depois
    // de 15s — melhor mostrar o que houver do que a Uni correndo para sempre.
    setTimeout(() => document.getElementById('loading')?.classList.add('pronto'), 15000);
  </script>
</body>
</html>
