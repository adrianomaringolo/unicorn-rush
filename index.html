<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5d8f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UnicornRush 🦄</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="UnicornRush" />
  <link rel="preload" href="./assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/": "./vendor/" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="panel score">
        <span class="label">Pontos</span>
        <span id="score">0</span>
      </div>
      <div class="panel hearts">
        <span class="label">Corações</span>
        <span>💗 <span id="hearts">0</span></span>
      </div>
      <div class="panel goal">
        <span class="label">Meta</span>
        <span id="goal">0/25</span>
      </div>
      <div class="panel level">
        <span class="label">Fase</span>
        <span id="level">1</span>
      </div>
      <div class="panel keys">
        <span class="label">Chaves</span>
        <span>🔑 <span id="keys">0/3</span></span>
      </div>
      <div class="panel lives">
        <span class="label">Vidas</span>
        <span id="lives">💗💗💗</span>
      </div>
      <div class="panel distance">
        <span class="label">Distância</span>
        <span id="distance">0</span>
      </div>
      <div class="panel best">
        <span class="label">Recorde</span>
        <span id="best">0</span>
      </div>
      <button id="pause" class="panel mute" aria-label="Pausar o jogo" hidden>⏸️</button>
      <button id="mute" class="panel mute" aria-label="Ligar ou desligar a música">🔊</button>
    </div>

    <div id="flash"></div>
    <div id="powers"></div>
    <div id="toast"></div>

    <div id="touch-controls">
      <button data-action="left" aria-label="Ir para a esquerda">⬅️</button>
      <button data-action="jump" aria-label="Pular">⬆️</button>
      <button data-action="right" aria-label="Ir para a direita">➡️</button>
    </div>

    <div id="overlay">
      <div class="card">
        <p class="brand"><img class="brand-mark" src="./assets/icon.svg" alt="" width="26" height="26" />UnicornRush</p>
        <div id="overlay-steps" aria-hidden="true"></div>
        <h1 id="overlay-title"></h1>
        <div id="overlay-chips"></div>
        <p id="overlay-text"></p>
        <div id="overlay-extra"></div>
        <div id="overlay-buttons"></div>
        <p class="hint">
          <span class="hint-keyboard">
            <b>Setas</b> ou <b>A / D</b> para escolher · <b>Enter</b> para continuar
          </span>
          <span class="hint-touch">
            Toque para escolher e para continuar
          </span>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
