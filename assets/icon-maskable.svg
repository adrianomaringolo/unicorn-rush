<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="UnicornRush">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e6ff"/>
      <stop offset="1" stop-color="#ffcfe6"/>
    </linearGradient>
    <clipPath id="recorte"><rect width="512" height="512"/></clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect width="512" height="512" fill="url(#fundo)"/>

    <!-- o desenho inteiro, com folga nas bordas -->
    <g transform="translate(240 296) scale(.64) translate(-256 -256)">

      <!-- crina: três faixas largas atrás da cabeça -->
      <g fill="none" stroke-width="62" stroke-linecap="round">
        <path d="M296 172c-100 16-146 78-156 158" stroke="#ff7b9d"/>
        <path d="M286 252c-88 24-128 78-138 148" stroke="#ffc247"/>
        <path d="M284 332c-76 34-108 82-116 146" stroke="#6cc5ff"/>
      </g>

      <!-- orelha, atrás da cabeça -->
      <path d="M266 156l-26-84 76 56z" fill="#f4f7ff"/>

      <!-- cabeça e focinho numa peça só -->
      <path d="M300 120c62 0 104 48 104 114 0 22-4 40-6 56 30 6 48 30 48 58
               0 34-28 58-66 58-24 0-42-8-54-22-4 30-4 60-4 92v46H240V420
               c0-36 10-56 10-94 0-34-18-56-18-92 0-64 40-114 68-114z" fill="#ffffff"/>
      <ellipse cx="404" cy="352" rx="14" ry="11" fill="#ff9dc0"/>

      <!-- olho -->
      <circle cx="336" cy="252" r="21" fill="#3a2b46"/>

      <!-- chifre -->
      <path d="M304 142l34-126 44 130z" fill="#ffc247"/>
    </g>
  </g>
</svg>
